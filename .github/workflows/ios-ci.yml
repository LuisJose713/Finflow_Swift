name: FinFlow iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: ${{ matrix.device }} regression tests
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    env:
      FINFLOW_DEVICE: ${{ matrix.device }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Xcode environment
        run: |
          python3 scripts/verify_project.py
          xcodebuild -version
          xcodebuild -list -project FinFlow.xcodeproj
      - name: Start simulator while the app builds
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = [d for group in json.load(sys.stdin)["devices"].values() for d in group
                     if d.get("isAvailable") and d["name"].startswith(os.environ["FINFLOW_DEVICE"])]
          print(devices[0]["udid"] if devices else "")
          ')
          test -n "$UDID"
          echo "FINFLOW_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
      - name: Verify app icon and COP, gesture and API contracts
        if: matrix.device == 'iPhone'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_project.py
          swiftc -parse-as-library FinFlow/Core/Utilities/Formatters.swift scripts/COPInputChecks.swift -o "$RUNNER_TEMP/cop-checks"
          "$RUNNER_TEMP/cop-checks"
          swiftc -parse-as-library FinFlow/Core/Utilities/DrawerSwipePolicy.swift scripts/DrawerSwipeChecks.swift -o "$RUNNER_TEMP/drawer-checks"
          "$RUNNER_TEMP/drawer-checks"
          swiftc -parse-as-library FinFlow/Core/Models/Models.swift FinFlow/Core/Utilities/Formatters.swift scripts/APIContractChecks.swift -o "$RUNNER_TEMP/api-checks"
          "$RUNNER_TEMP/api-checks"
      - name: Build for iOS Simulator (ad hoc signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project FinFlow.xcodeproj -scheme FinFlow -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FinFlowDerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            build 2>&1 | tee "$RUNNER_TEMP/finflow-build.log"
      - name: Run native regression tests
        shell: bash
        run: |
          set -euo pipefail
          UDID="$FINFLOW_SIMULATOR_UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="$RUNNER_TEMP/FinFlowDerivedData/Build/Products/Debug-iphonesimulator/FinFlow.app"
          xcrun simctl install "$UDID" "$APP_PATH"
          SIMCTL_CHILD_FINFLOW_UI_TESTING=1 xcrun simctl launch "$UDID" com.finflow.ios
          sleep 3
          xcrun simctl terminate "$UDID" com.finflow.ios
          TEST_ARGS=()
          if [ "$FINFLOW_DEVICE" = "iPad" ]; then
            TEST_ARGS+=(
              -only-testing:FinFlowUITests/FinFlowUITests/testLoginAndRegistrationValidation
              -only-testing:FinFlowUITests/FinFlowUITests/testDashboardChartsAndAmounts
              -only-testing:FinFlowUITests/FinFlowUITests/testAccessibilityLargeText
            )
          fi
          xcodebuild test -project FinFlow.xcodeproj -scheme FinFlow \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/FinFlowDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/FinFlow-$FINFLOW_DEVICE.xcresult" \
            "${TEST_ARGS[@]}" -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/finflow-test.log"
      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finflow-ios-${{ matrix.device }}-test-log
          path: ${{ runner.temp }}/finflow-test.log
          retention-days: 7
      - name: Launch FinFlow and capture the screen
        shell: bash
        run: |
          set -euo pipefail
          SIMCTL_CHILD_FINFLOW_UI_TESTING=1 xcrun simctl launch "$FINFLOW_SIMULATOR_UDID" com.finflow.ios
          sleep 3
          xcrun simctl io "$FINFLOW_SIMULATOR_UDID" screenshot "$RUNNER_TEMP/finflow-launch.png"
      - name: Export screenshots from UI tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/FinFlow-$FINFLOW_DEVICE.xcresult"
          if [ -f "$RESULT/Info.plist" ]; then
            xcrun xcresulttool export attachments --path "$RESULT" \
              --output-path "$RUNNER_TEMP/screenshots-$FINFLOW_DEVICE"
          fi
      - name: Upload test reports and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finflow-ios-qa-${{ matrix.device }}
          path: |
            ${{ runner.temp }}/FinFlow-*.xcresult
            ${{ runner.temp }}/screenshots-*
            ${{ runner.temp }}/finflow-*.log
            ${{ runner.temp }}/finflow-launch.png
          retention-days: 7

  release:
    name: Release for physical iPhone and iPad
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify project
        run: python3 scripts/verify_project.py
      - name: Build Release without distribution credentials
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project FinFlow.xcodeproj -scheme FinFlow -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FinFlowRelease" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/finflow-release.log"
      - name: Upload Release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finflow-ios-release-log
          path: ${{ runner.temp }}/finflow-release.log
          retention-days: 7
