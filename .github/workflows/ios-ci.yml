name: FinFlow iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Simulator
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -list -project FinFlow.xcodeproj
      - name: Test FinFlow Disponible calculation engine
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library FinFlow/Core/Models/DisponibleCalculator.swift Tests/DisponibleCalculatorSmoke.swift -o "$RUNNER_TEMP/finflow-disponible-smoke"
          "$RUNNER_TEMP/finflow-disponible-smoke"
      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project FinFlow.xcodeproj \
            -scheme FinFlow \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FinFlowDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/finflow-build.log"
      - name: Boot iPhone Simulator and launch FinFlow
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/FinFlowDerivedData/Build/Products/Debug-iphonesimulator/FinFlow.app"
          test -d "$APP_PATH" || { echo "::error::FinFlow.app missing"; exit 1; }

          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [d for group in data["devices"].values() for d in group
                    if d.get("isAvailable") and d["name"].startswith("iPhone")]
          print(phones[0]["udid"] if phones else "")
          ')
          test -n "$UDID" || { echo "::error::No iPhone simulator available"; exit 1; }
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" com.finflow.ios
          sleep 8
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/finflow-ios-launch.png"
      - name: Upload simulator launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: finflow-ios-simulator-screenshot
          path: ${{ runner.temp }}/finflow-ios-launch.png
          retention-days: 7
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finflow-ios-build-log
          path: ${{ runner.temp }}/finflow-build.log
          retention-days: 7
